name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-macos:
    runs-on: macos-14
    env:
      OFFICIAL_BUILD: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails v3 CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.28

      - name: Install Frontend Dependencies
        run: |
          npm --prefix frontend ci

      - name: Build Frontend Assets
        run: |
          npm --prefix frontend run build

      - name: Extract Clean SemVer Version
        id: get_version
        run: |
          RAW_TAG="${{ github.ref_name }}"
          CLEAN_VERSION="${RAW_TAG#v}"
          if [ -z "${CLEAN_VERSION}" ] || [ "${RAW_TAG}" = "main" ]; then
            CLEAN_VERSION=$(node -p "require('./frontend/package.json').version")
          fi
          echo "version=${CLEAN_VERSION}" >> $GITHUB_OUTPUT
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag_name=${RAW_TAG}" >> $GITHUB_OUTPUT
          else
            echo "tag_name=v${CLEAN_VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Build macOS App Bundle
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
          OFFICIAL_BUILD: 'true'
        run: |
          wails3 task darwin:package OFFICIAL_BUILD=true VERSION=${VERSION}

      - name: Run Tests
        run: |
          go test ./...
          npm --prefix frontend test

      - name: Package Release Assets
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
          OFFICIAL_BUILD: 'true'
        run: |
          # Package .app.zip for in-app updater
          wails3 task darwin:package:zip ARCH=arm64 OFFICIAL_BUILD=true VERSION=${VERSION}
          # Package .dmg for manual distribution
          wails3 task darwin:package:dmg OFFICIAL_BUILD=true VERSION=${VERSION}
          # Generate SHA256 checksums
          wails3 task darwin:checksums
          # Verify binary has official_build enabled
          ./bin/pata.app/Contents/MacOS/pata --version | grep "official_build: true"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pata-macos-${{ steps.get_version.outputs.version }}
          path: |
            bin/*.app.zip
            bin/*.dmg
            bin/SHA256SUMS

      - name: Prepare Clean Release Notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.get_version.outputs.tag_name }}
        run: |
          # If the release already exists, clear existing notes so generate_release_notes
          # won't append duplicate text on re-runs.
          gh release edit "${TAG_NAME}" --notes "" 2>/dev/null || true

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag_name }}
          name: "Pata v${{ steps.get_version.outputs.version }}"
          files: |
            bin/*.app.zip
            bin/*.dmg
            bin/SHA256SUMS
          draft: false
          prerelease: false
          generate_release_notes: true
