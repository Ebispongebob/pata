<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 828 816" role="img" aria-label="啪嗒 Pata 品牌标识"><defs>
 <linearGradient id="outerLight" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF9F2"/><stop offset=".55" stop-color="#F8F8FF"/><stop offset="1" stop-color="#E8F1FF"/></linearGradient>
 <radialGradient id="warmAura" cx=".24" cy=".34" r=".9"><stop stop-color="#FFE8D5" stop-opacity=".95"/><stop offset="1" stop-color="#FFF0DA" stop-opacity="0"/></radialGradient>
 <radialGradient id="purpleAura" cx=".22" cy=".84" r=".68"><stop stop-color="#E9D2FF" stop-opacity=".85"/><stop offset="1" stop-color="#DFD8FE" stop-opacity="0"/></radialGradient>
 <radialGradient id="coolAura" cx=".93" cy=".84" r=".68"><stop stop-color="#D9E4FF" stop-opacity="1"/><stop offset="1" stop-color="#D9E4FF" stop-opacity="0"/></radialGradient>
 <linearGradient id="purpleBack" x1="0" y1=".1" x2="1" y2="1"><stop stop-color="#FF9D40"/><stop offset=".4" stop-color="#FF5DAE"/><stop offset=".74" stop-color="#AD50F0"/><stop offset="1" stop-color="#606FFB"/></linearGradient>
 <linearGradient id="yellowMiddle" x1=".1" y1=".03" x2=".83" y2="1"><stop stop-color="#FFEE57"/><stop offset=".3" stop-color="#FFC63B"/><stop offset=".69" stop-color="#FF9C46"/><stop offset="1" stop-color="#FFBB76"/></linearGradient>
 <linearGradient id="whiteLeaf" x1=".15" y1="0" x2=".92" y2="1"><stop stop-color="#FFFFF7"/><stop offset=".26" stop-color="#FFF6ED"/><stop offset=".57" stop-color="#F9F5FE"/><stop offset=".83" stop-color="#E8ECFF"/><stop offset="1" stop-color="#FFFDFB"/></linearGradient>
 <!-- 组件层 (PataLogo.tsx) leafEdge 起点为浅色标题栏辨识度调整为 #E2DAF0 (P6-R1 遗留观察项，防止将来从源重派生时丢失) -->
 <linearGradient id="leafEdge" x1=".1" y1="0" x2=".5" y2="1"><stop stop-color="#FFFFFF"/><stop offset=".6" stop-color="#FFF7F3"/><stop offset="1" stop-color="#E1D5FF"/></linearGradient>
 <linearGradient id="sparkYellow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFE843"/><stop offset=".57" stop-color="#FFBD17"/><stop offset="1" stop-color="#FF8E25"/></linearGradient>
 <linearGradient id="darkBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#313847"/><stop offset=".54" stop-color="#222934"/><stop offset="1" stop-color="#171D28"/></linearGradient>
 <radialGradient id="darkGlow" cx=".48" cy=".66" r=".85"><stop stop-color="#616084" stop-opacity=".4"/><stop offset="1" stop-color="#111926" stop-opacity="0"/></radialGradient>
 <filter id="sceneShadow" x="-40%" y="-40%" width="180%" height="190%"><feGaussianBlur stdDeviation="16"/></filter>
 <filter id="paperShadow" x="-30%" y="-30%" width="170%" height="180%"><feGaussianBlur stdDeviation="10"/></filter>
 <filter id="sparkGlow" x="-90%" y="-90%" width="300%" height="300%"><feGaussianBlur stdDeviation="7"/></filter>
 </defs><g id="pata-symbol">
  <!-- each card has a smooth, closed, tangent-continuous cubic contour -->
  <path d="M166 343 C176 330 188 322 204 318 C221 313 237 314 254 319 L477 365 C517 374 550 414 579 475 C604 527 601 566 567 586 C559 592 546 597 533 602 L344 668 C297 683 265 663 243 630 C222 596 198 538 177 490 L143 408 C132 375 150 354 166 343 Z" fill="#803ACD" opacity=".22" transform="translate(5 12)" filter="url(#sceneShadow)"/>
