  <path d="M211 279 C231 270 248 269 266 275 L479 326 C523 340 553 380 575 441 C597 496 610 532 591 562 C584 573 571 581 551 588 L405 625 C354 642 320 626 295 586 C266 542 245 499 220 442 C193 382 184 345 193 304 C196 292 201 284 211 279 Z" fill="#DD747F" opacity=".22" transform="translate(3 7)" filter="url(#paperShadow)"/>
  <g id="pata-card-middle">
    <path d="M211 279 C231 270 248 269 266 275 L479 326 C523 340 553 380 575 441 C597 496 610 532 591 562 C584 573 571 581 551 588 L405 625 C354 642 320 626 295 586 C266 542 245 499 220 442 C193 382 184 345 193 304 C196 292 201 284 211 279 Z" fill="#EC9770" opacity=".4" transform="translate(1.5 5)"/>
    <path d="M211 279 C231 270 248 269 266 275 L479 326 C523 340 553 380 575 441 C597 496 610 532 591 562 C584 573 571 581 551 588 L405 625 C354 642 320 626 295 586 C266 542 245 499 220 442 C193 382 184 345 193 304 C196 292 201 284 211 279 Z" fill="url(#yellowMiddle)" stroke="#FFE596" stroke-width="3.1" stroke-linejoin="round"/>
    <path d="M202 304 C191 347 203 397 228 452 C255 511 281 559 307 595 C331 629 366 639 407 621" fill="none" stroke="#FFEFBA" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/>
  </g>
  <path d="M310 224 C331 224 345 229 362 236 L484 279 C527 295 539 316 560 366 C569 388 579 409 591 432 C607 456 639 470 664 487 C688 504 684 523 661 538 C648 547 633 550 610 556 L453 583 C402 592 366 577 342 544 C307 496 285 444 260 383 C243 341 234 301 240 269 C245 238 272 221 310 224 Z" fill="#9E8FC3" opacity=".17" transform="translate(5 9)" filter="url(#paperShadow)"/>
  <g id="pata-card-front">
    <!-- Soft underlip gives the folded white card a controlled 3D paper edge. -->
    <path d="M310 224 C331 224 345 229 362 236 L484 279 C527 295 539 316 560 366 C569 388 579 409 591 432 C607 456 639 470 664 487 C688 504 684 523 661 538 C648 547 633 550 610 556 L453 583 C402 592 366 577 342 544 C307 496 285 444 260 383 C243 341 234 301 240 269 C245 238 272 221 310 224 Z" fill="#D7D0F2" opacity=".72" transform="translate(1 5)"/>
    <path d="M310 224 C331 224 345 229 362 236 L484 279 C527 295 539 316 560 366 C569 388 579 409 591 432 C607 456 639 470 664 487 C688 504 684 523 661 538 C648 547 633 550 610 556 L453 583 C402 592 366 577 342 544 C307 496 285 444 260 383 C243 341 234 301 240 269 C245 238 272 221 310 224 Z" fill="url(#whiteLeaf)" stroke="url(#leafEdge)" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M308 227 C277 223 252 237 246 270 C241 302 251 352 270 402 C290 454 317 515 346 547 C370 581 404 589 451 582" fill="none" stroke="#FFFFFF" stroke-opacity=".82" stroke-width="3" stroke-linecap="round"/>
    <path d="M341 545 C368 582 403 592 453 586 L611 560 C634 555 648 550 664 539" fill="none" stroke="#C6BEEF" stroke-opacity=".4" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <g id="pata-sparkles"><g opacity=".14" fill="#FF9923" filter="url(#sparkGlow)"><rect x="488" y="143" width="44" height="105" rx="23"/><rect x="575" y="169" width="47" height="109" rx="24" transform="rotate(47 599 222)"/><rect x="605" y="316" width="96" height="44" rx="22" transform="rotate(8 653 338)"/></g>
  <g fill="url(#sparkYellow)" stroke="#FFE277" stroke-width="1.5"><rect x="490" y="143" width="42" height="103" rx="21" transform="rotate(-1 511 195)"/><rect x="575" y="171" width="45" height="105" rx="22.5" transform="rotate(46 598 224)"/><rect x="602" y="318" width="103" height="43" rx="21.5" transform="rotate(6 653 339)"/></g></g>
</g></svg>